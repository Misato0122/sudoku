<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>藍の数独</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="数独">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EBEFF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>
<style>
/* Layout: 藍染めの紙に墨で刷った盤。デスクトップは盤＋右の操作列、スマホは縦積み */
:root {
  --paper: #EBEFF5;
  --surface: #FFFFFF;
  --ink: #17202D;
  --muted: #627089;
  --line: #CDD5E1;
  --line-strong: #23314A;
  --ai: #2B4A9C;
  --ai-soft: #DCE4F7;
  --peer: #EEF2F8;
  --same: #C5D3F1;
  --error: #C03A22;
  --error-soft: #F9DFD8;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-digit: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Zen Kaku Gothic New", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F131A; --surface: #171D27; --ink: #E5E9F0; --muted: #8C97AB;
    --line: #29313F; --line-strong: #7F8DA6; --ai: #8FAAF2; --ai-soft: #22304F;
    --peer: #1D2430; --same: #2E3D63; --error: #F2806A; --error-soft: #3B221E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F131A; --surface: #171D27; --ink: #E5E9F0; --muted: #8C97AB;
  --line: #29313F; --line-strong: #7F8DA6; --ai: #8FAAF2; --ai-soft: #22304F;
  --peer: #1D2430; --same: #2E3D63; --error: #F2806A; --error-soft: #3B221E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px;
  padding-inline: 16px; padding-block: 20px 32px;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 920px; margin: 0 auto; display: grid; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; }
h1 { font-family: var(--f-display); font-size: 30px; margin: 0; letter-spacing: .06em; display: flex; align-items: baseline; gap: 12px; }
h1 small { font-family: var(--f-ui); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .14em; }
.diffs { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 999px; border: 1px solid var(--line); flex-wrap: wrap; }
.diffs button { border: 0; background: none; color: var(--muted); font: 500 13px var(--f-ui); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.diffs button[aria-pressed="true"] { background: var(--ai); color: var(--surface); }
.diffs button:hover:not([aria-pressed="true"]) { color: var(--ink); }

.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.confirm span { flex: 1 1 220px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }
@media (max-width: 720px) { .main { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

.status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); font-weight: 700; font-family: var(--f-digit); font-size: 15px; margin-left: 6px; }
.status .bad b { color: var(--error); }

.board {
  container-type: inline-size;
  width: 100%; max-width: 560px; aspect-ratio: 1; margin: 0 auto;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 2px;
  background: var(--line-strong); border: 2px solid var(--line-strong); border-radius: 6px; overflow: hidden;
  user-select: none;
}
.box { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 1px; background: var(--line); }
.cell {
  background: var(--surface); position: relative; display: grid; place-items: center;
  font-family: var(--f-digit); font-size: 6.4cqi; font-weight: 500; color: var(--ai);
  cursor: pointer; transition: background-color .12s;
}
.cell.given { color: var(--ink); font-weight: 700; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.sel { background: var(--ai-soft); box-shadow: inset 0 0 0 2px var(--ai); }
.cell.err { color: var(--error); background: var(--error-soft); }
.cell.sel.err { box-shadow: inset 0 0 0 2px var(--error); }
.cell.pop { animation: pop .22s ease-out; }
.cell.shake { animation: shake .3s; }
.notes { position: absolute; inset: 6%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); font-size: 2.1cqi; font-weight: 500; color: var(--muted); }
.notes i { font-style: normal; display: grid; place-items: center; border-radius: 3px; }
.notes i.hit { color: var(--surface); background: var(--ai); }
.board.won .cell { animation: wave .6s ease-out both; animation-delay: calc(var(--d) * 22ms); }
@keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@keyframes wave { 0% { background: var(--surface); } 40% { background: var(--same); } 100% { background: var(--surface); } }
@media (prefers-reduced-motion: reduce) { .cell, .board.won .cell { animation: none !important; transition: none; } }

.side { display: grid; gap: 14px; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool {
  display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
  font: 500 12px var(--f-ui); cursor: pointer;
}
.tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { border-color: var(--ai); }
.tool[aria-pressed="true"] { background: var(--ai); color: var(--surface); border-color: var(--ai); }
.tool .tag { font-size: 10px; letter-spacing: .08em; }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 720px) { .pad { grid-template-columns: repeat(9, 1fr); gap: 4px; } }
.num {
  aspect-ratio: 1 / 1; max-width: 100%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ai); border-radius: 10px; cursor: pointer;
  font: 700 26px var(--f-digit); display: grid; place-items: center; align-content: center; gap: 0; line-height: 1;
}
.num small { font: 500 10px var(--f-ui); color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.num:hover { border-color: var(--ai); }
.num:disabled { opacity: .3; cursor: default; }
.pad.noting .num { color: var(--muted); font-size: 20px; }
@media (max-width: 720px) { .num { font-size: 20px; aspect-ratio: auto; padding-block: 8px; border-radius: 8px; } }

.option { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.option input { accent-color: var(--ai); width: 16px; height: 16px; }
.keys { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0; }
.keys kbd { font: 500 11px var(--f-ui); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--ink); }
@media (hover: none) { .keys { display: none; } }

.btn { border: 1px solid var(--ai); background: var(--ai); color: var(--surface); font: 700 14px var(--f-ui); padding: 9px 18px; border-radius: 999px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ai); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

.done { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--paper) 70%, transparent); backdrop-filter: blur(3px); z-index: 10; }
.done .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 28px 24px; width: min(360px, 100%); text-align: center; display: grid; gap: 14px; box-shadow: 0 20px 50px -20px rgba(10, 20, 40, .35); }
.done h2 { font-family: var(--f-display); font-size: 34px; margin: 0; letter-spacing: .1em; color: var(--ai); }
.done dl { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; gap: 8px; }
.done dt { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.done dd { margin: 2px 0 0; font: 700 20px var(--f-digit); font-variant-numeric: tabular-nums; }
.done .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

html { color-scheme: light; -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; touch-action: manipulation; }
[hidden] { display: none !important; }
</style>


<div class="app">
  <header>
    <h1>藍の数独 <small>SUDOKU</small></h1>
    <div class="diffs" id="diffs" role="group" aria-label="難易度"></div>
  </header>

  <div class="confirm" id="confirm" hidden>
    <span id="confirmText"></span>
    <button class="btn" id="confirmYes" type="button">始める</button>
    <button class="btn ghost" id="confirmNo" type="button">続ける</button>
  </div>

  <div class="main">
    <section>
      <div class="status">
        <span>難易度<b id="diffLabel"></b></span>
        <span id="mistakeWrap">ミス<b id="mistakes">0</b></span>
        <span>時間<b id="timer">00:00</b></span>
      </div>
      <div class="board" id="board" role="grid" aria-label="数独の盤面"></div>
    </section>

    <aside class="side">
      <div class="tools">
        <button class="tool" id="undo" type="button" title="元に戻す (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>戻す</button>
        <button class="tool" id="erase" type="button" title="消す (Delete)">
          <svg viewBox="0 0 24 24"><path d="M20 20H8l-5-5 10-10 8 8-6 7"/><path d="m8 10 6 6"/></svg>消す</button>
        <button class="tool" id="note" type="button" aria-pressed="false" title="メモ (N)">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>メモ <span class="tag" id="noteTag">OFF</span></span></button>
        <button class="tool" id="hint" type="button" title="ヒント (H)">
          <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>ヒント</button>
      </div>
      <div class="pad" id="pad"></div>
      <label class="option"><input type="checkbox" id="showErrors" checked> 間違いをその場で表示する</label>
      <p class="keys"><kbd>1</kbd>–<kbd>9</kbd> 入力　<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 移動　<kbd>Delete</kbd> 消す<br><kbd>N</kbd> メモ切替　<kbd>H</kbd> ヒント　<kbd>Ctrl</kbd>+<kbd>Z</kbd> 戻す</p>
    </aside>
  </div>
</div>

<div class="done" id="done" hidden>
  <div class="card" role="dialog" aria-labelledby="doneTitle">
    <h2 id="doneTitle">完成</h2>
    <dl>
      <div><dt>時間</dt><dd id="dTime"></dd></div>
      <div><dt>ミス</dt><dd id="dMiss"></dd></div>
      <div><dt>ヒント</dt><dd id="dHint"></dd></div>
    </dl>
    <div class="row">
      <button class="btn" id="again" type="button">次の問題へ</button>
      <button class="btn ghost" id="closeDone" type="button">盤面を見る</button>
    </div>
  </div>
</div>

<script>
(() => {
const DIFF = {
  easy:   { label: 'やさしい', clues: 40 },
  normal: { label: 'ふつう',   clues: 32 },
  hard:   { label: 'むずかしい', clues: 27 },
  expert: { label: '達人',     clues: 23 },
};
const KEY = 'ai-sudoku-v1';
const $ = id => document.getElementById(id);
const rowOf = i => (i / 9) | 0, colOf = i => i % 9, boxOf = i => ((rowOf(i) / 3) | 0) * 3 + ((colOf(i) / 3) | 0);
const PEERS = Array.from({ length: 81 }, (_, i) => {
  const s = [];
  for (let j = 0; j < 81; j++) if (j !== i && (rowOf(j) === rowOf(i) || colOf(j) === colOf(i) || boxOf(j) === boxOf(i))) s.push(j);
  return s;
});

/* ---------- 生成と解法（ビットマスク＋候補最少セル優先） ---------- */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function solve(grid, limit, random) {
  const g = grid.slice(), R = Array(9).fill(0), C = Array(9).fill(0), B = Array(9).fill(0);
  for (let i = 0; i < 81; i++) if (g[i]) { const b = 1 << g[i]; R[rowOf(i)] |= b; C[colOf(i)] |= b; B[boxOf(i)] |= b; }
  let count = 0, first = null;
  const rec = () => {
    let best = -1, bestMask = 0, bestN = 10;
    for (let i = 0; i < 81; i++) {
      if (g[i]) continue;
      const m = ~(R[rowOf(i)] | C[colOf(i)] | B[boxOf(i)]) & 0x3FE;
      let n = 0; for (let x = m; x; x &= x - 1) n++;
      if (n < bestN) { bestN = n; best = i; bestMask = m; if (n <= 1) break; }
    }
    if (best < 0) { count++; if (!first) first = g.slice(); return; }
    if (bestN === 0) return;
    const ds = []; for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) ds.push(d);
    if (random) shuffle(ds);
    const r = rowOf(best), c = colOf(best), bx = boxOf(best);
    for (const d of ds) {
      const b = 1 << d;
      g[best] = d; R[r] |= b; C[c] |= b; B[bx] |= b;
      rec();
      g[best] = 0; R[r] &= ~b; C[c] &= ~b; B[bx] &= ~b;
      if (count >= limit) return;
    }
  };
  rec();
  return { count, solution: first };
}
function generate(clues) {
  const solution = solve(Array(81).fill(0), 1, true).solution;
  const puzzle = solution.slice();
  let left = 81;
  for (const i of shuffle([...Array(81).keys()])) {
    if (left <= clues) break;
    const keep = puzzle[i]; puzzle[i] = 0;
    if (solve(puzzle, 2, false).count !== 1) puzzle[i] = keep; else left--;
  }
  return { puzzle, solution };
}

/* ---------- 状態 ---------- */
let S;
function newGame(diff) {
  const { puzzle, solution } = generate(DIFF[diff].clues);
  S = { diff, puzzle, solution, values: puzzle.slice(), notes: Array(81).fill(0), sel: puzzle.indexOf(0),
        noteMode: false, history: [], mistakes: 0, hints: 0, elapsed: 0, done: false,
        showErrors: S ? S.showErrors : true };
  $('board').classList.remove('won');
  $('done').hidden = true;
  save(); render();
}
function valid(s) { return s && Array.isArray(s.values) && s.values.length === 81 && DIFF[s.diff]; }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ ...S, history: S.history.slice(-60) })); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return valid(s) ? s : null; } catch (e) { return null; } }
const inProgress = () => S && !S.done && S.history.length > 0;
const pushHist = () => { S.history.push([S.values.slice(), S.notes.slice()]); if (S.history.length > 200) S.history.shift(); };

/* ---------- 操作 ---------- */
let anim = {};
function input(d) {
  const i = S.sel;
  if (i < 0 || S.done || S.puzzle[i]) return;
  if (S.noteMode) {
    if (S.values[i]) return;
    pushHist(); S.notes[i] ^= 1 << d;
  } else {
    if (S.values[i] === d) return;
    pushHist(); S.values[i] = d; S.notes[i] = 0;
    if (d !== S.solution[i]) { S.mistakes++; anim = { i, cls: 'shake' }; }
    else { anim = { i, cls: 'pop' }; for (const p of PEERS[i]) S.notes[p] &= ~(1 << d); }
    checkDone();
  }
  save(); render();
}
function erase() {
  const i = S.sel;
  if (i < 0 || S.done || S.puzzle[i]) return;
  if (!S.values[i] && !S.notes[i]) return;
  pushHist(); S.values[i] = 0; S.notes[i] = 0;
  save(); render();
}
function undo() {
  if (S.done || !S.history.length) return;
  [S.values, S.notes] = S.history.pop();
  save(); render();
}
function hint() {
  if (S.done) return;
  let i = S.sel;
  if (i < 0 || S.puzzle[i] || S.values[i] === S.solution[i]) {
    const open = [];
    for (let j = 0; j < 81; j++) if (S.values[j] !== S.solution[j]) open.push(j);
    if (!open.length) return;
    i = open[(Math.random() * open.length) | 0];
  }
  pushHist();
  S.sel = i; S.values[i] = S.solution[i]; S.notes[i] = 0; S.hints++;
  for (const p of PEERS[i]) S.notes[p] &= ~(1 << S.solution[i]);
  anim = { i, cls: 'pop' };
  checkDone(); save(); render();
}
function checkDone() {
  if (S.values.every((v, i) => v === S.solution[i])) {
    S.done = true;
    $('board').classList.add('won');
    setTimeout(showDone, 900);
  }
}
function showDone() {
  $('dTime').textContent = fmt(S.elapsed);
  $('dMiss').textContent = S.mistakes;
  $('dHint').textContent = S.hints;
  $('done').hidden = false;
  $('again').focus();
}
function move(dr, dc) {
  const i = S.sel < 0 ? 0 : S.sel;
  S.sel = ((rowOf(i) + dr + 9) % 9) * 9 + (colOf(i) + dc + 9) % 9;
  render();
}
const fmt = t => { const h = (t / 3600) | 0, m = ((t / 60) | 0) % 60, s = t % 60, p = n => String(n).padStart(2, '0'); return (h ? h + ':' : '') + p(m) + ':' + p(s); };

/* ---------- 描画 ---------- */
const cells = [];
function build() {
  const board = $('board');
  for (let b = 0; b < 9; b++) {
    const box = document.createElement('div'); box.className = 'box';
    for (let k = 0; k < 9; k++) {
      const r = ((b / 3) | 0) * 3 + ((k / 3) | 0), c = (b % 3) * 3 + (k % 3), i = r * 9 + c;
      const el = document.createElement('div');
      el.className = 'cell'; el.setAttribute('role', 'gridcell'); el.style.setProperty('--d', r + c);
      el.addEventListener('pointerdown', () => { S.sel = i; render(); });
      cells[i] = el; box.appendChild(el);
    }
    board.appendChild(box);
  }
  const pad = $('pad');
  for (let d = 1; d <= 9; d++) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'num'; btn.dataset.d = d;
    btn.innerHTML = d + '<small></small>';
    btn.addEventListener('click', () => input(d));
    pad.appendChild(btn);
  }
  const diffs = $('diffs');
  for (const [key, v] of Object.entries(DIFF)) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = v.label; btn.dataset.diff = key;
    btn.addEventListener('click', () => requestNew(key));
    diffs.appendChild(btn);
  }
}
function render() {
  const sel = S.sel, sv = sel >= 0 ? S.values[sel] : 0;
  for (let i = 0; i < 81; i++) {
    const el = cells[i], v = S.values[i], given = !!S.puzzle[i];
    const cls = ['cell'];
    if (given) cls.push('given');
    if (sel >= 0 && i !== sel && PEERS[sel].includes(i)) cls.push('peer');
    if (sv && v === sv && i !== sel) cls.push('same');
    if (i === sel) cls.push('sel');
    if (S.showErrors && v && !given && v !== S.solution[i]) cls.push('err');
    if (anim.i === i) cls.push(anim.cls);
    el.className = cls.join(' ');
    if (v) { el.textContent = v; el.setAttribute('aria-label', `${rowOf(i) + 1}行${colOf(i) + 1}列 ${v}`); }
    else if (S.notes[i]) {
      let h = '<div class="notes">';
      for (let d = 1; d <= 9; d++) h += S.notes[i] & (1 << d) ? `<i class="${d === sv ? 'hit' : ''}">${d}</i>` : '<i></i>';
      el.innerHTML = h + '</div>';
      el.setAttribute('aria-label', `${rowOf(i) + 1}行${colOf(i) + 1}列 空き`);
    } else { el.textContent = ''; el.setAttribute('aria-label', `${rowOf(i) + 1}行${colOf(i) + 1}列 空き`); }
  }
  anim = {};
  const counts = Array(10).fill(0);
  S.values.forEach((v, i) => { if (v && v === S.solution[i]) counts[v]++; });
  document.querySelectorAll('.num').forEach(b => {
    const d = +b.dataset.d, left = 9 - counts[d];
    b.disabled = left === 0 || S.done;
    b.querySelector('small').textContent = left ? '残' + left : '';
  });
  $('pad').classList.toggle('noting', S.noteMode);
  $('note').setAttribute('aria-pressed', S.noteMode);
  $('noteTag').textContent = S.noteMode ? 'ON' : 'OFF';
  $('undo').disabled = !S.history.length || S.done;
  document.querySelectorAll('#diffs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.diff === S.diff));
  $('diffLabel').textContent = DIFF[S.diff].label;
  $('mistakes').textContent = S.mistakes;
  $('mistakeWrap').classList.toggle('bad', S.mistakes > 0);
  $('timer').textContent = fmt(S.elapsed);
  $('showErrors').checked = S.showErrors;
}

/* ---------- 新規ゲームの確認 ---------- */
let pending = null;
function requestNew(diff) {
  if (!inProgress()) { hideConfirm(); newGame(diff); return; }
  pending = diff;
  $('confirmText').textContent = `今の問題を終了して「${DIFF[diff].label}」の新しい問題を始めますか？`;
  $('confirm').hidden = false;
}
function hideConfirm() { pending = null; $('confirm').hidden = true; }
$('confirmYes').addEventListener('click', () => { const d = pending; hideConfirm(); if (d) newGame(d); });
$('confirmNo').addEventListener('click', hideConfirm);

/* ---------- イベント ---------- */
$('undo').addEventListener('click', undo);
$('erase').addEventListener('click', erase);
$('hint').addEventListener('click', hint);
$('note').addEventListener('click', () => { S.noteMode = !S.noteMode; save(); render(); });
$('showErrors').addEventListener('change', e => { S.showErrors = e.target.checked; save(); render(); });
$('again').addEventListener('click', () => newGame(S.diff));
$('closeDone').addEventListener('click', () => { $('done').hidden = true; });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-9]$/.test(k)) { input(+k); e.preventDefault(); }
  else if (k === 'Backspace' || k === 'Delete' || k === '0') { erase(); e.preventDefault(); }
  else if (k === 'ArrowUp') { move(-1, 0); e.preventDefault(); }
  else if (k === 'ArrowDown') { move(1, 0); e.preventDefault(); }
  else if (k === 'ArrowLeft') { move(0, -1); e.preventDefault(); }
  else if (k === 'ArrowRight') { move(0, 1); e.preventDefault(); }
  else if (k.toLowerCase() === 'n') { S.noteMode = !S.noteMode; save(); render(); }
  else if (k.toLowerCase() === 'h') hint();
  else if (k === 'Escape') { $('done').hidden = true; hideConfirm(); }
});

let lastSave = 0;
setInterval(() => {
  if (!S || S.done || document.hidden) return;
  S.elapsed++;
  $('timer').textContent = fmt(S.elapsed);
  if (S.elapsed - lastSave >= 5) { lastSave = S.elapsed; save(); }
}, 1000);

function start(data) {
  build();
  const prev = valid(data && data.S) ? data.S : load();
  if (prev) {
    S = prev;
    if (S.done) $('board').classList.add('won');
    render();
  } else newGame('normal');
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
